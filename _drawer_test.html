<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="css/bootstrap.min.css" rel="stylesheet" />
<link href="css/sb-admin-2.css" rel="stylesheet" />
<link href="font-awesome-4.4.0/css/font-awesome.min.css" rel="stylesheet" />
<title>Drawer Faithful Test</title>
<style>
/* real menu-card styles copied from sidebar.php */
.sidebar { width:240px; background-color:#1f2937; }
.sidebar .nav > li > a { color:#e5e7eb; padding:12px 18px; font-size:14px; }
.sidebar-nav .nav li > a { display:flex; align-items:center; gap:12px; position:relative; padding:12px 14px; margin:6px 10px; border-radius:14px; background:rgba(255,255,255,0.04); color:#cbd5e1; }
.sidebar-nav .nav li > a i:not(.arrow){ width:34px; height:34px; min-width:34px; display:flex; align-items:center; justify-content:center; border-radius:10px; background:rgba(255,255,255,0.08); color:#facc15; font-size:14px; }
.sidebar-nav .nav li > a span { flex:1; }
.sidebar-nav .nav li > a .arrow { margin-left:auto; }
.profile-card-sidebar { display:flex; align-items:center; gap:12px; padding:12px; margin:15px; background:linear-gradient(135deg,#334155,#020617); border-radius:14px; }
.profile-avatar img { width:48px; height:48px; border-radius:50%; }
.profile-info b { display:block; color:#fff; font-size:14px; }
.profile-info span { font-size:11px; color:#94a3b8; }

@media (max-width: 767px) {
	html, body { overflow-x: hidden; max-width: 100%; }
	#wrapper { overflow-x: hidden; width: 100%; }
	.navbar-fixed-top { min-height:50px; display:flex; align-items:center; flex-wrap:nowrap; z-index:1046; }
	.navbar-header { display:flex; align-items:center; flex:1 1 auto; width:auto; min-width:0; float:none; }
	.navbar-brand { flex:1 1 auto; width:auto !important; min-width:0; height:auto; padding:12px 10px !important; font-size:13px !important; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
	.navbar-toggle { display:block; float:none; margin:8px 4px 8px 8px; }
	.navbar-top-links { flex:0 0 auto; float:none !important; display:flex; align-items:center; width:auto; margin:0; padding:0 6px; background:transparent; }
	.navbar-top-links > li { float:none !important; display:inline-flex; align-items:center; }

	.sidebar, .navbar-default.sidebar {
		position:fixed !important; top:50px; left:0;
		width:82% !important; max-width:300px; height:calc(100% - 50px);
		margin:0 !important; z-index:1046; overflow-y:auto;
		transform:translateX(-100%) !important; transition:transform .3s ease;
		box-shadow:2px 0 18px rgba(0,0,0,.35);
	}
	body.sidebar-open .sidebar, body.sidebar-open .navbar-default.sidebar { transform:translateX(0) !important; }
	.sidebar .sidebar-nav.navbar-collapse { display:block !important; visibility:visible !important; height:auto !important; max-height:none !important; min-height:100% !important; width:100% !important; overflow:visible !important; padding:0 !important; margin:0 !important; border-top:0 !important; box-shadow:none !important; }
	.sidebar #side-menu { display:block !important; }
	#sidebarOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.45); z-index:1040; }
	body.sidebar-open #sidebarOverlay { display:block; }
	body.sidebar-open { overflow:hidden; }
	#page-wrapper { margin-left:0 !important; padding:8px 12px 90px !important; width:100%; border-left:none; }
}
</style>
</head>
<body class="sidebar-open">
<div id="wrapper">
<nav class="navbar navbar-default navbar-fixed-top" role="navigation" style="margin-bottom:0; background-color:#428bca;">
	<div class="navbar-header bg-primary">
		<button type="button" class="navbar-toggle" onclick="toggleSidebarDrawer()">
			<span class="icon-bar"></span><span class="icon-bar"></span><span class="icon-bar"></span>
		</button>
		<a class="navbar-brand" href="#" style="color:#fff; background-color:#111827; width:240px;"><i class="fa fa-balance-scale fa-fw"></i> <b>TIMBANGAN PISS</b></a>
	</div>
	<ul class="nav navbar-top-links navbar-right">
		<li class="dropdown"><a href="#" style="color:#fff;"><i class="fa fa-cog"></i> Pengaturan</a></li>
	</ul>

	<div class="navbar-default sidebar" role="navigation">
		<div class="sidebar-nav navbar-collapse" style="min-height:100vh; background-color:#1f2937;">
			<ul class="nav" id="side-menu" style="margin-bottom:70px;">
				<div class="profile-card-sidebar">
					<div class="profile-avatar"><img src="uploads/profile-default.png"></div>
					<div class="profile-info"><b>Nama Kasir</b><span>Kasir | Shift 1</span></div>
				</div>
				<li><a href="#"><i class="fa fa-dashboard fa-fw"></i> <span>Dashboard</span></a></li>
				<li><a href="#"><i class="fa fa-credit-card fa-fw"></i> <span>Pembayaran</span><span class="fa arrow"></span></a></li>
				<li><a href="#"><i class="fa fa-trophy fa-fw"></i> <span>Pencapaian Kasir</span></a></li>
				<li><a href="#"><i class="fa fa-history fa-fw"></i> <span>Update Log</span></a></li>
			</ul>
		</div>
	</div>
</nav>
<div id="sidebarOverlay" onclick="closeSidebarDrawer()"></div>
<div id="page-wrapper"><br><br><br><br><h3>Konten halaman</h3></div>
</div>
<script>
function toggleSidebarDrawer(){ document.body.classList.toggle("sidebar-open"); }
function closeSidebarDrawer(){ document.body.classList.remove("sidebar-open"); }
</script>
</body>
</html>
