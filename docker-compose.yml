services:
    app:
        build: .
        restart: unless-stopped
        ports:
            - "8082:80"
        environment:
            DB_HOST: db
            DB_USERNAME: root
            DB_PASSWORD: ""
            DB_DATABASE: db_piss
        depends_on:
            db:
                condition: service_healthy

    db:
        image: mysql:5.7
        restart: unless-stopped
        command: --max-allowed-packet=512M
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
            MYSQL_DATABASE: db_piss
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mysqladmin ping -h 127.0.0.1 -u root --silent",
                ]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s

    phpmyadmin:
        image: phpmyadmin:5.2-apache
        restart: unless-stopped
        ports:
            - "8083:80"
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            PMA_ARBITRARY: 0
            UPLOAD_LIMIT: 256M
            MAX_EXECUTION_TIME: 600
            MEMORY_LIMIT: 512M
        depends_on:
            db:
                condition: service_healthy

volumes:
    db_data:
